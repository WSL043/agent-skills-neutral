name: Scan skill ecosystem

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prepare report directory
        run: mkdir -p artifacts
      - name: Scan tracked upstream deltas
        run: python scripts/scan_upstreams.py --json > artifacts/tracked-upstreams.json
      - name: Discover untracked skill repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_upstreams.py --output artifacts/discovered-upstreams.json
      - name: Add scan summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tracked = json.loads(Path('artifacts/tracked-upstreams.json').read_text())['repositories']
          discovered = json.loads(Path('artifacts/discovered-upstreams.json').read_text())
          states = {}
          for item in tracked:
              states[item['state']] = states.get(item['state'], 0) + 1
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write('# Skill ecosystem scan\n\n')
              f.write('Tracked upstream states: ' + ', '.join(f'{k}={v}' for k, v in sorted(states.items())) + '\n\n')
              f.write(f"Untracked repositories containing SKILL.md: {len(discovered['candidates'])}\n\n")
              f.write('Discovery remains metadata-only. No candidate was executed or promoted.\n')
          PY
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: skill-ecosystem-scan
          path: artifacts/*.json
