name: Scan skill ecosystem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prepare report directory
        run: mkdir -p artifacts
      - name: Scan tracked upstream deltas
        run: python scripts/scan_upstreams.py --json > artifacts/tracked-upstreams.json
      - name: Discover direct, mechanism, and transitive ecosystem sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_upstreams.py --include-mechanisms --output artifacts/discovered-upstreams.json
      - name: Add scan summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tracked = json.loads(Path('artifacts/tracked-upstreams.json').read_text())['repositories']
          discovered = json.loads(Path('artifacts/discovered-upstreams.json').read_text())
          states = {}
          for item in tracked:
              states[item['state']] = states.get(item['state'], 0) + 1
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write('# Skill ecosystem scan\n\n')
              f.write('Tracked upstream states: ' + ', '.join(f'{k}={v}' for k, v in sorted(states.items())) + '\n\n')
              f.write(f"Untracked repository-search candidates: {len(discovered['candidates'])}\n\n")
              f.write(f"Capability-lift-first candidates: {discovered.get('capability_lift_candidate_count', 0)}\n\n")
              f.write(f"One-hop GitHub repositories referenced by tracked sources: {len(discovered['transitive_references'])}\n\n")
              f.write('Capability-lift signals only prioritize review. Discovery remains metadata-only; file-level verification, execution, and promotion are deferred to review.\n')
          PY
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: skill-ecosystem-scan
          path: artifacts/*.json
