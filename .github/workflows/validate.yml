name: Validate canonical library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile maintenance scripts
        run: python -m compileall -q scripts
      - name: Validate catalog and evolution state
        run: python scripts/validate_catalog.py
      - name: Test routing
        run: python scripts/test_routing.py
      - name: Test evolution runner
        run: python scripts/test_evolution_runner.py
      - name: Test runtime bundle boundary
        run: python scripts/test_runtime_bundle.py
      - name: Test execution attribution evidence
        run: python scripts/test_execution_attribution.py
      - name: Build clean runtime bundle
        run: python scripts/build_runtime_bundle.py build --output dist/runtime
      - name: Verify runtime bundle manifest
        run: python scripts/build_runtime_bundle.py verify --bundle dist/runtime
